<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 HomePageX</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 720px; margin: 0 auto; padding: 32px 24px; line-height: 1.7; }
    pre { white-space: pre-wrap; padding: 16px; border: 1px solid #8886; border-radius: 8px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <h1>关于 HomePageX</h1>
  <p>这是外部静态目录中的 HTML 文件，可在 iframe 内展示，也可作为完整页面打开，无需重新编译。</p>
  <h2>从 JSON 文件加载的内容</h2>
  <pre id="data" aria-live="polite">正在加载…</pre>
  <p><a href="/" target="_top">返回主页</a></p>
  <script type="module">
    const output = document.getElementById('data');
    try {
      const response = await fetch('./data/about.json');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      output.textContent = JSON.stringify(await response.json(), null, 2);
    } catch (error) {
      output.textContent = `加载失败：${error.message}`;
    }
  </script>
</body>
</html>
