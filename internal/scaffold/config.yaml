# HomepageX 配置
# 由 `homepagex init` 生成的示例，按需修改

server:
  port: "8090"
  # debug: 保存页面后立即生效并可用 {page}.local.yaml 本地覆盖；对外部署用 release
  mode: release
  # session cookie 的 Secure 策略：auto（请求本身是 HTTPS 才带）/ true / false
  # 部署在「TLS 终止的反向代理」之后时，容器内看到的仍是明文 HTTP，请显式设为 true
  cookie_secure: auto
  # 会话有效期
  session_ttl: "2h"

# 访问规则，格式: user:pass@path:perm
#   - 路径写法: /a 子树匹配; /a* 前缀匹配; * 或 /* 匹配全部
#   - 权限后缀: rw 读写 / ro 只读（省略默认 ro）/ no 拒绝
#   - 用户名留空（@path）即匿名基线，表示未登录用户能做什么
#   - !path 是「认证墙」：匿名不可访问，登录后按各自权限访问
#   - 已登录用户自身规则优先，未命中则回退匿名基线，所以不必给每个用户补 /*:ro 兜底
#   - 写操作必须已登录且具备 rw
auths:
  - "@*:ro" # 匿名：全站只读
  - "admin:admin123@*:rw" # 管理员：全站可读写。⚠️ 请务必修改默认密码

# 硬拒绝路径：任何人都不能访问（含管理员），用于临时下线页面
deny: []

# 图标 CDN：页面里用 icons-local/{cdn-key}/{type}/{name} 访问，服务端会下载并缓存到本地
# 图标缓存目录（相对本配置文件所在目录）。内嵌的前端资源是只读的，缓存必须落在可写目录，
# 离线部署时建议指向一个可写的持久化目录
icons_dir: "./icons-cache"
# 是否允许从 CDN 下载缺失的图标：
#   true（默认）: 缓存未命中时按 icons_cdn 下载并缓存到 icons_dir
#   false: 完全不访问外网（离线/内网部署用），缓存未命中的图标直接返回 404
# 注意：下载失败的图标会记入 10 分钟的失败缓存，期间不再重试，避免离线时逐个图标等满超时
icons_remote: true
icons_cdn:
  dashboard-icons: "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/"

# 页面配置目录（相对本配置文件所在目录）
pages_dir: "./pages"

# 前端目录（相对本配置文件所在目录）：
#   - 目录里存在 index.html 时优先用它（开发时 `pnpm --dir frontend run build` 后立即生效）
#   - 目录不存在/没有 index.html 时用二进制内嵌的前端资源 —— 单文件部署（只发布二进制 +
#     配置 + pages）时无需前端目录，这一项留空或指向不存在的目录都可以
frontend_dir: "./frontend/build"

# 发布后可直接添加 HTML/JSON 等文件到此目录，无需源码、前端构建或重新编译。
# 与前端文件同名时保留原前端文件；相对本配置文件所在目录，留空则关闭。
static_dir: "./static"

# 页面默认配置，所有页面都继承，可在页面文件里覆盖
page_defaults:
  title: "My Homepage"
  subtitle: "Welcome"
  theme: "ocean-depths"

# 顶部导航，页面文件里没写 navs 时使用
page_navs:
  - name: "Home"
    icon: "fas fa-home"
    url: "/"
  - name: "Tools"
    icon: "fas fa-tools"
    url: "/tools"
  # HTML 示例（保留默认 YAML 菜单，按需取消注释）
  # - name: "关于"
  #   icon: "fas fa-info-circle"
  #   url: "/about.html"
  #   mode: iframe  # iframe: 骨架内展示；page: 完整独立页面；省略: YAML
  #   target: "_blank"  # 可选：新标签页打开独立文档
